<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>祈福圈 Good Wishes Circle · 即将上线</title>
<meta name="description" content="祈福圈 Good Wishes Circle：为远方的家人点一盏灯。山海再远，灯火相连。for all your well-wishers. 2027 年除夕上线。">
<meta property="og:title" content="祈福圈 Good Wishes Circle">
<meta property="og:description" content="山海再远，灯火相连。for all your well-wishers.">
<meta name="theme-color" content="#0f1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 56'%3E%3Cpath d='M8 4 Q20 0 32 4 L36 40 Q20 46 4 40 Z' fill='%23f2a541'/%3E%3Cellipse cx='20' cy='42' rx='9' ry='2.4' fill='%235a1f0e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0f1430; --sky:#2a3466; --amber:#f2a541; --gold:#ffe2b0;
    --text:#eef0fa; --muted:#b7bce0; --seal:#b8322a;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100%;
    background:radial-gradient(90% 60% at 50% 100%, #3a2a4a 0%, rgba(58,42,74,0) 70%), linear-gradient(var(--sky), var(--night) 75%);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    line-height:1.7;
    overflow-x:hidden;
  }
  .serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:#fff}
  .lantern{position:absolute;bottom:-80px;animation:rise linear infinite}
  .lantern svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(242,165,65,.6));animation:sway 4s ease-in-out infinite alternate}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:.85}100%{transform:translateY(-115vh);opacity:0}}
  @keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

  main{
    position:relative;z-index:1;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;
    padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(40px + env(safe-area-inset-bottom,0px));
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px}
  .brand .zh{font-size:22px;font-weight:700;letter-spacing:.2em;padding-left:.2em;color:#fff3dc}
  .brand .en{font-size:13px;letter-spacing:.08em;color:var(--muted)}
  h1{
    margin:0;font-weight:700;color:var(--gold);
    font-size:clamp(40px,11vw,84px);line-height:1.25;letter-spacing:.08em;
    text-shadow:0 0 30px rgba(242,165,65,.35);
  }
  .slogan{margin:0;font-size:clamp(18px,4.5vw,22px);color:#f2d7a8}
  .lead{margin:0;max-width:24em;color:#d5d8f0;font-size:16px}
  .date{
    margin-top:14px;display:inline-flex;align-items:center;gap:12px;
    padding:12px 24px;border-radius:999px;
    background:rgba(242,165,65,.12);border:1px solid rgba(242,165,65,.5);
    color:#fff3dc;font-size:16px;
  }
  .date b{color:var(--amber);font-weight:600}
  .seal{
    width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff4e6;
    display:grid;place-items:center;font-size:16px;font-weight:700;flex:none
  }
  .contact{margin-top:6px;font-size:14px;color:var(--muted)}
  .contact a{color:var(--amber);text-decoration:none}
  .contact a:hover{text-decoration:underline}
  footer{
    position:relative;z-index:1;text-align:center;
    padding:0 24px calc(24px + env(safe-area-inset-bottom,0px));
    font-size:12px;color:#8f95bd
  }
  @media (prefers-reduced-motion: reduce){
    .lantern{animation:none;bottom:auto}
    .lantern svg{animation:none}
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main>
    <div class="brand">
      <span class="zh serif">祈福圈</span>
      <span class="en">Good Wishes Circle</span>
    </div>
    <h1 class="serif">山海再远<br>灯火相连</h1>
    <p class="slogan serif">for all your well-wishers</p>
    <p class="lead">为远方的家人点一盏灯，锁一把同心锁。<br>人在海外，心意送到家。</p>
    <div class="date">
      <span class="seal serif">福</span>
      <span>2027 年 2 月 6 日 · 除夕 <b>正式上线</b></span>
    </div>
    <p class="contact">合作与联系 · <a href="mailto:info@goodwishescircle.com">info@goodwishescircle.com</a></p>
  </main>

  <footer>© 2026 Good Wishes Circle · London</footer>

<script>
(function(){
  var sky=document.getElementById('sky');
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var i=0;i<70;i++){
    var s=document.createElement('span');s.className='star';
    var r=Math.random()<.15?3:2;
    s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*70+'%;width:'+r+'px;height:'+r+'px;opacity:'+(.2+Math.random()*.6).toFixed(2);
    sky.appendChild(s);
  }
  var svg='<svg viewBox="0 0 40 56"><path d="M8 4 Q20 0 32 4 L36 40 Q20 46 4 40 Z" fill="#f2a541"/><ellipse cx="20" cy="26" rx="10" ry="12" fill="#ffe2a8" opacity=".7"/><path d="M8 4 Q20 0 32 4" fill="none" stroke="#8a2b14" stroke-width="1.2"/><ellipse cx="20" cy="42" rx="9" ry="2.4" fill="#5a1f0e"/><circle cx="20" cy="47" r="2.2" fill="#ffd27a"/></svg>';
  for(var j=0;j<14;j++){
    var l=document.createElement('div');l.className='lantern';
    var w=16+Math.random()*26, dur=18+Math.random()*16;
    l.style.left=(3+Math.random()*94)+'%';
    l.style.width=w+'px';
    if(still){l.style.top=(10+Math.random()*75)+'%';}
    else{l.style.animationDuration=dur+'s';l.style.animationDelay=(-Math.random()*dur)+'s';}
    l.innerHTML=svg;sky.appendChild(l);
  }
})();
</script>
</body>
</html>
